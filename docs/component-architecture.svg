<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Cross-exchange spread arbitrage component architecture</title>
  <desc id="desc">Architecture from four exchange integrations through market data, signal generation, execution controls, position state, rebalancing, and file records.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#24292f" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#57606a"/></marker>
    <style>
      .band{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.5}.box{fill:#fff;stroke:#57606a;stroke-width:1.5;filter:url(#shadow)}
      .control{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5;filter:url(#shadow)}.recovery{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5;filter:url(#shadow)}
      .heading{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f;text-anchor:middle}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a;text-anchor:middle}
      .flow{fill:none;stroke:#57606a;stroke-width:2;marker-end:url(#arrow)}.secondary{fill:none;stroke:#8c959f;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}.legend{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#57606a}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#fff"/>

  <rect class="band" x="35" y="30" width="1330" height="155" rx="12"/><text class="heading" x="65" y="68">Venue integrations</text>
  <rect class="box" x="85" y="92" width="190" height="58" rx="8"/><text class="label" x="180" y="127">Binance</text>
  <rect class="box" x="335" y="92" width="190" height="58" rx="8"/><text class="label" x="430" y="127">OKX</text>
  <rect class="box" x="585" y="92" width="190" height="58" rx="8"/><text class="label" x="680" y="127">Gate</text>
  <rect class="box" x="835" y="92" width="190" height="58" rx="8"/><text class="label" x="930" y="127">Bitget</text>
  <rect class="box" x="1085" y="92" width="230" height="58" rx="8"/><text class="label" x="1200" y="119">Venue API layer</text><text class="small" x="1200" y="141">public and authenticated</text>

  <rect class="band" x="35" y="215" width="1330" height="235" rx="12"/><text class="heading" x="65" y="253">Market data and signal state</text>
  <rect class="box" x="75" y="300" width="220" height="78" rx="8"/><text class="label" x="185" y="331">SymbolSelector</text><text class="small" x="185" y="354">shared liquid universe</text>
  <rect class="box" x="340" y="300" width="220" height="78" rx="8"/><text class="label" x="450" y="331">WSFeed</text><text class="small" x="450" y="354">normalized live ticks</text>
  <rect class="box" x="605" y="300" width="220" height="78" rx="8"/><text class="label" x="715" y="331">Tracker</text><text class="small" x="715" y="354">latest cross-venue state</text>
  <rect class="box" x="870" y="300" width="220" height="78" rx="8"/><text class="label" x="980" y="331">BaselineTracker</text><text class="small" x="980" y="354">rolling equilibrium spread</text>
  <rect class="box" x="1135" y="300" width="190" height="78" rx="8"/><text class="label" x="1230" y="331">SignalDetector</text><text class="small" x="1230" y="354">event and cooldown rules</text>
  <path class="flow" d="M295 339 H340"/><path class="flow" d="M560 339 H605"/><path class="flow" d="M825 339 H870"/><path class="flow" d="M1090 339 H1135"/>
  <path class="secondary" d="M715 378 V412 H1230 V378"/>

  <rect class="band" x="35" y="480" width="1330" height="260" rx="12"/><text class="heading" x="65" y="518">Execution, risk, and capital control</text>
  <rect class="box" x="75" y="565" width="230" height="82" rx="8"/><text class="label" x="190" y="597">RebalanceSupervisor</text><text class="small" x="190" y="621">cash distribution and routes</text>
  <rect class="control" x="355" y="565" width="210" height="82" rx="8"/><text class="label" x="460" y="597">RiskManager</text><text class="small" x="460" y="621">limits, halts, cooldowns</text>
  <rect class="control" x="615" y="565" width="210" height="82" rx="8"/><text class="label" x="720" y="597">CostModel</text><text class="small" x="720" y="621">fees, funding, slippage</text>
  <rect class="box" x="875" y="565" width="190" height="82" rx="8"/><text class="label" x="970" y="597">Trader</text><text class="small" x="970" y="621">entry, exit, recovery</text>
  <rect class="box" x="1115" y="565" width="210" height="82" rx="8"/><text class="label" x="1220" y="597">Exchange clients</text><text class="small" x="1220" y="621">orders and balances</text>
  <path class="flow" d="M305 606 H355"/><path class="flow" d="M565 590 V540 H850 V590 H875"/><path class="flow" d="M825 620 H875"/><path class="flow" d="M1065 606 H1107"/>
  <path class="flow" d="M1230 378 V470 H970 V557"/>

  <rect class="band" x="35" y="770" width="1330" height="65" rx="12"/>
  <rect class="box" x="350" y="780" width="280" height="44" rx="8"/><text class="label" x="490" y="808">PositionManager</text>
  <rect class="box" x="770" y="780" width="280" height="44" rx="8"/><text class="label" x="910" y="808">File records</text>
  <path class="flow" d="M970 647 V755 H490 V772"/><path class="flow" d="M630 802 H762"/>
  <path class="secondary" d="M715 450 V755 H910 V772"/>

  <rect x="1080" y="842" width="13" height="13" rx="2" fill="#fff" stroke="#57606a"/><text class="legend" x="1101" y="853">processing or state</text>
  <rect x="1220" y="842" width="13" height="13" rx="2" fill="#fff8c5" stroke="#9a6700"/><text class="legend" x="1241" y="853">decision or control</text>
</svg>
